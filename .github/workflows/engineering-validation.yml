name: Engineering Validation

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mep-ai-calculator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mep-ai-calculator/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Engineering validation
        run: npm run validate
      - name: Production build
        run: npm run build
